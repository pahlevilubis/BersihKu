name: Build APK BersihKu

on:
  push:
    branches-ignore:
      - build-log
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan kunci tanda tangan (dari GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_BASE64 atau KEYSTORE_PASSWORD belum diisi. Buka Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # Runner ubuntu-latest sudah punya Android SDK bawaan (ANDROID_HOME)
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk BersihKu.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BersihKu-APK
          path: BersihKu.apk
          if-no-files-found: error

      # APK juga diterbitkan di halaman Releases supaya bisa di-download langsung dari HP
      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BersihKu build ${{ github.run_number }}
          body: APK BersihKu siap pasang. Download BersihKu.apk di bawah ini.
          files: BersihKu.apk
          make_latest: true

      # Kalau build gagal, catatan error disimpan di branch build-log supaya mudah diperiksa
      - name: Simpan catatan error
        if: failure()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log 2>/dev/null || echo "build.log tidak ada" > /tmp/log/build.log
          cd /tmp/log
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build.log
          git commit -q -m "Log build gagal untuk ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:build-log
